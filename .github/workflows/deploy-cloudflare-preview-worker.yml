name: Deploy Cloudflare Preview Worker

on:
  push:
    branches:
      - main
    paths:
      - "apps/cloudflare-worker/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-cloudflare-preview-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-preview-worker
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy Preview Worker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_WORKER_URL: https://type-battle-cloudflare-worker-preview.s1f102503015.workers.dev
      COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Cloudflare credentials are not configured; preview deployment is skipped."
          fi

      - name: Checkout
        if: steps.credentials.outputs.available == 'true'
        uses: actions/checkout@v5

      - name: Setup Node
        if: steps.credentials.outputs.available == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.credentials.outputs.available == 'true'
        run: npm ci

      - name: Build shared package
        if: steps.credentials.outputs.available == 'true'
        run: npm run build --workspace @type-battle/shared

      - name: Typecheck worker
        if: steps.credentials.outputs.available == 'true'
        run: npm run typecheck --workspace @type-battle/cloudflare-worker

      - name: Test worker
        if: steps.credentials.outputs.available == 'true'
        run: npm run test --workspace @type-battle/cloudflare-worker

      - name: Deploy isolated preview worker
        if: steps.credentials.outputs.available == 'true'
        run: npm run deploy --workspace @type-battle/cloudflare-worker -- --env preview --keep-vars --var "DEPLOY_COMMIT_SHA:$COMMIT_SHA"

      - name: Ensure preview room-state secret
        if: steps.credentials.outputs.available == 'true'
        shell: bash
        run: |
          cd apps/cloudflare-worker
          if ! npx wrangler secret list --env preview --json | jq -e '.[] | select(.name == "ROOM_STATE_WRITE_TOKEN")' >/dev/null; then
            openssl rand -hex 32 | npx wrangler secret put ROOM_STATE_WRITE_TOKEN --env preview
          fi

      - name: Smoke test preview worker
        if: steps.credentials.outputs.available == 'true'
        run: node apps/cloudflare-worker/scripts/smoke-worker.mjs
