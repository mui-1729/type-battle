name: Agent time attack base patch

on:
  push:
    branches: ["agent/fix-input-mode-sync"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-input-mode-sync

      - name: Apply guarded source patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_all(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new))

          vm = "apps/web/app/_lib/home-page-view-model.ts"
          replace_once(vm,
          '''  const activeProgressBase = timeAttackPosition\n    ? timeAttackPrompts.slice(0, timeAttackPosition.promptIndex).reduce(\n        (total, prompt) => total + (effectiveInputMode === "kana"\n          ? Array.from(prompt.typing.hiragana).length\n          : buildRomajiTypingPlan(prompt.typing.hiragana).guide.length),\n        0\n      )\n    : 0;\n''',
          '''  const activeCanonicalProgressBase = timeAttackPosition\n    ? timeAttackPrompts.slice(0, timeAttackPosition.promptIndex).reduce(\n        (total, prompt) => total + Array.from(prompt.typing.hiragana).length,\n        0\n      )\n    : 0;\n  const activeRomajiProgressBase = timeAttackPosition\n    ? timeAttackPrompts.slice(0, timeAttackPosition.promptIndex).reduce(\n        (total, prompt) => total + buildRomajiTypingPlan(prompt.typing.hiragana).guide.length,\n        0\n      )\n    : 0;\n  const activeProgressBase = effectiveInputMode === "kana"\n    ? activeCanonicalProgressBase\n    : activeRomajiProgressBase;\n''')

          replace_once(vm,
          '''    activeProgressBase,\n    completedTimeAttackPrompts,\n''',
          '''    activeProgressBase,\n    activeCanonicalProgressBase,\n    activeRomajiProgressBase,\n    completedTimeAttackPrompts,\n''')

          page = "apps/web/app/page.tsx"
          replace_once(page,
          '''    activeProgressBase,\n    completedTimeAttackPrompts,\n''',
          '''    activeProgressBase,\n    activeCanonicalProgressBase,\n    activeRomajiProgressBase,\n    completedTimeAttackPrompts,\n''')

          replace_all(page,
          '''          progressBase: activeProgressBase,\n          inputMode: inputModeRef.current\n''',
          '''          progressBase: activeProgressBase,\n          progressBaseByMode: {\n            kana: activeCanonicalProgressBase,\n            romaji: activeRomajiProgressBase\n          },\n          inputMode: inputModeRef.current\n''', 4)
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/_lib/home-page-view-model.ts apps/web/app/page.tsx
          if git diff --cached --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git commit -m "fix(time-attack): preserve cumulative base across input modes"
          git push origin HEAD:agent/fix-input-mode-sync
