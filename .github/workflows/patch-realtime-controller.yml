name: Patch realtime controller

on:
  push:
    branches:
      - agent/refactor-web-realtime-controller

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/refactor-web-realtime-controller
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Patch page.tsx
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('apps/web/app/page.tsx')
          text = page.read_text()

          old = '''import {\n  createRealtimeSocket,\n  getDefaultRealtimeUrl,\n  type RealtimeTransport,\n  type RealtimeSocket\n} from "./_lib/realtime-client";'''
          new = '''import {\n  getDefaultRealtimeUrl,\n  type RealtimeTransport,\n  type RealtimeSocket\n} from "./_lib/realtime-client";'''
          assert text.count(old) == 1, 'realtime-client import mismatch'
          text = text.replace(old, new)

          old = '''import { getPracticeSocketToRelease } from "./_lib/practice-socket-lifecycle";'''
          new = '''import {\n  disconnectPracticeRealtimeConnection,\n  disconnectRealtimeConnection,\n  getRoomRealtimeUrl,\n  openRealtimeConnection\n} from "./_lib/realtime-connection-controller";'''
          assert text.count(old) == 1, 'practice socket import mismatch'
          text = text.replace(old, new)

          old = '''  const connectSocket = useCallback(\n    (url: string, kind: "practice" | "room") => {\n    const previousSocket = socketRef.current;\n    socketRef.current = null;\n    storedRoomJoinInFlightRef.current = false;\n    previousSocket?.disconnect();\n    const socket = createRealtimeSocket({ transport: REALTIME_TRANSPORT, url });\n    socketRef.current = socket;\n    socketModeRef.current = kind;\n    setSocketMode(kind);\n    attachSocketHandlers(socket, kind);\n    return socket;\n    },\n    [attachSocketHandlers]\n  );\n\n  const connectPracticeSocket = useCallback(() => connectSocket(realtimeUrl, "practice"), [connectSocket, realtimeUrl]);\n  const connectRoomSocket = useCallback(\n    (roomCode: string) => {\n    const roomUrl = new URL(`/rooms/${roomCode}/socket`, realtimeUrl).toString();\n    return connectSocket(roomUrl, "room");\n    },\n    [connectSocket, realtimeUrl]\n  );\n\n  const disconnectCurrentSocket = useCallback(() => {\n    const socket = socketRef.current;\n    socketRef.current = null;\n    socketModeRef.current = null;\n    storedRoomJoinInFlightRef.current = false;\n    socket?.disconnect();\n    setSocketMode(null);\n    setConnected(false);\n  }, []);\n\n  const disconnectPracticeSocket = useCallback(() => {\n    const socket = getPracticeSocketToRelease(socketRef.current, socketModeRef.current);\n    if (!socket) {\n      return;\n    }\n\n    socketRef.current = null;\n    socketModeRef.current = null;\n    socket.disconnect();\n    setSocketMode(null);\n    setConnected(false);\n  }, []);'''
          new = '''  const connectSocket = useCallback(\n    (url: string, kind: "practice" | "room") =>\n      openRealtimeConnection({\n        refs: { socketRef, socketModeRef, storedRoomJoinInFlightRef },\n        setters: { setSocketMode, setConnected },\n        transport: REALTIME_TRANSPORT,\n        url,\n        mode: kind,\n        attachHandlers: attachSocketHandlers\n      }),\n    [attachSocketHandlers]\n  );\n\n  const connectPracticeSocket = useCallback(\n    () => connectSocket(realtimeUrl, "practice"),\n    [connectSocket, realtimeUrl]\n  );\n  const connectRoomSocket = useCallback(\n    (roomCode: string) => connectSocket(getRoomRealtimeUrl(realtimeUrl, roomCode), "room"),\n    [connectSocket, realtimeUrl]\n  );\n\n  const disconnectCurrentSocket = useCallback(() => {\n    disconnectRealtimeConnection({\n      refs: { socketRef, socketModeRef, storedRoomJoinInFlightRef },\n      setters: { setSocketMode, setConnected }\n    });\n  }, []);\n\n  const disconnectPracticeSocket = useCallback(() => {\n    disconnectPracticeRealtimeConnection({\n      refs: { socketRef, socketModeRef, storedRoomJoinInFlightRef },\n      setters: { setSocketMode, setConnected }\n    });\n  }, []);'''
          assert text.count(old) == 1, 'connection lifecycle block mismatch'
          text = text.replace(old, new)
          page.write_text(text)
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/patch-realtime-controller.yml
          git add apps/web/app/page.tsx
          git commit -m "refactor(web): Realtime接続処理をcontrollerへ移す"
          git push origin HEAD:agent/refactor-web-realtime-controller
