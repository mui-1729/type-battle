name: Agent dependency audit

on:
  push:
    branches: ["agent/fix-dependency-audit"]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Production audit
        continue-on-error: true
        run: npm audit --omit=dev
      - name: Full audit
        continue-on-error: true
        run: npm audit
