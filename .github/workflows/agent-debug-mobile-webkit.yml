name: Agent debug mobile WebKit

on:
  push:
    branches: ["agent/fix-ios-keyboard-prompt"]

jobs:
  debug-mobile-webkit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - run: npm run build
        env:
          NEXT_PUBLIC_CLOUDFLARE_REALTIME_URL: ws://127.0.0.1:8787
      - name: Create WebKit boot diagnostic
        run: |
          cat > tests/e2e/debug-webkit-boot.spec.ts <<'EOF'
          import { expect, test } from "@playwright/test";

          test("prints WebKit boot errors", async ({ page }) => {
            page.on("pageerror", (error) => console.log("PAGEERROR:", error.message, error.stack));
            page.on("console", (message) => {
              if (["error", "warning"].includes(message.type())) {
                console.log(`CONSOLE ${message.type()}:`, message.text());
              }
            });
            const response = await page.goto("/");
            console.log("HTTP STATUS:", response?.status());
            console.log("BODY BEFORE:", (await page.locator("body").innerText()).slice(0, 1200));
            await page.waitForTimeout(4_000);
            console.log("BODY AFTER:", (await page.locator("body").innerText()).slice(0, 1200));
            console.log("SETTINGS HYDRATED:", await page.evaluate(() => localStorage.getItem("type-battle:player-settings")));
            await expect(page.locator("body")).toBeVisible();
          });
          EOF
      - name: Run WebKit boot diagnostic
        run: npx playwright test tests/e2e/debug-webkit-boot.spec.ts --project=mobile-webkit --reporter=list
