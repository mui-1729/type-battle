name: One-time Next.js security lockfile refresh
on:
  push:
    branches:
      - security/nextjs-oct-2026
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-oct-2026
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Update patched dependencies and lockfile
        run: npm install --workspace apps/web --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund next@16.4.1 react@19.2.9 react-dom@19.2.9
      - name: Commit dependency updates and remove this temporary workflow
        run: |
          git rm .github/workflows/security-nextjs-oct2026.yml
          git add apps/web/package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "fix: update Next.js and React security releases"
          git push origin HEAD:security/nextjs-oct-2026
