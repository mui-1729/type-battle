name: One-time source map security lockfile refresh
on:
  push:
    branches:
      - security/nextjs-oct-2026
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/nextjs-oct-2026
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Update resolvable vulnerable dependencies
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund || true
      - name: Verify production dependencies have no high alerts
        run: npm audit --omit=dev --audit-level=high
      - name: Commit updated lockfile and remove temporary workflow
        run: |
          git rm .github/workflows/security-fix-source-map.yml
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --quiet || git commit -m "fix: refresh vulnerable source-map-js dependency"
          git push origin HEAD:security/nextjs-oct-2026
