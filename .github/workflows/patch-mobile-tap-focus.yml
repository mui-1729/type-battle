name: Patch mobile tap focus

on:
  push:
    branches:
      - agent/fix-mobile-tap-focus

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-mobile-tap-focus
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Patch focus behavior and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('apps/web/app/page.tsx')
          text = page.read_text()

          old = '''  const prepareTypingInput = useCallback(() => {\n    typingInputRef.current?.focus({ preventScroll: true });\n  }, []);'''
          new = '''  const prepareTypingInput = useCallback(() => {\n    if (activeInputDeviceKind === "mobile") {\n      return;\n    }\n    typingInputRef.current?.focus({ preventScroll: true });\n  }, [activeInputDeviceKind]);'''
          assert text.count(old) == 1, 'prepareTypingInput target mismatch'
          text = text.replace(old, new)

          old = '''  useEffect(() => {\n    if (!acceptingTextInput) {\n      return;\n    }\n\n    const input = typingInputRef.current;\n    if (!input) {\n      return;\n    }\n\n    input.focus({ preventScroll: true });\n  }, [acceptingTextInput, activeTypingText]);'''
          new = '''  useEffect(() => {\n    if (!acceptingTextInput || activeInputDeviceKind === "mobile") {\n      return;\n    }\n\n    const input = typingInputRef.current;\n    if (!input) {\n      return;\n    }\n\n    input.focus({ preventScroll: true });\n  }, [acceptingTextInput, activeInputDeviceKind, activeTypingText]);'''
          assert text.count(old) == 1, 'auto focus effect target mismatch'
          text = text.replace(old, new)

          old = '''          onPointerDown={(event) => {\n            if (!isEditableTarget(event.target)) {\n              prepareTypingInput();\n            }\n          }}'''
          new = '''          onClick={(event) => {\n            if (!isEditableTarget(event.target)) {\n              typingInputRef.current?.focus({ preventScroll: true });\n            }\n          }}'''
          assert text.count(old) == 1, 'matchSurface focus target mismatch'
          text = text.replace(old, new)
          page.write_text(text)

          spec = Path('tests/e2e/mobile-typing.spec.ts')
          tests = spec.read_text()
          marker = '''test("supports physical-keyboard romaji input on a mobile device", async ({ page }) => {'''
          assert tests.count(marker) == 1, 'mobile typing test marker mismatch'
          addition = '''test("starts mobile text input with a normal tap instead of background autofocus", async ({ page }) => {\n  await page.goto("/");\n  await setNickname(page, "MobileTap");\n  await selectPracticeMode(page);\n  await page.getByRole("button", { name: "練習を開始" }).click();\n  await expect(page.locator(".status-playing")).toBeVisible({ timeout: 7_000 });\n\n  const textarea = page.getByLabel("入力欄");\n  await expect(textarea).not.toBeFocused();\n  await page.locator(".promptBox").click();\n  await expect(textarea).toBeFocused();\n});\n\n'''
          tests = tests.replace(marker, addition + marker)
          spec.write_text(tests)
          PY
          git diff --check
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/page.tsx tests/e2e/mobile-typing.spec.ts
          git commit -m "fix(mobile): 通常タップで入力を開始できるようにする"
          git push origin HEAD:agent/fix-mobile-tap-focus
