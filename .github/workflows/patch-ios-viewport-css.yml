name: Patch iOS viewport CSS

on:
  push:
    branches:
      - agent/stabilize-ios-viewport-e2e
    paths:
      - ".github/workflows/patch-ios-viewport-css.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-ios-viewport-e2e
      - name: Patch constrained mobile scroll rule
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/app/visual-reference.css")
          text = path.read_text()
          replacements = [
              (".appShell:not(.isHome) .sidePanel,", ".appShell:not(.isHome):not(.hasConstrainedViewport) .sidePanel,"),
              (".appShell:not(.isHome) .matchSurface {", ".appShell:not(.isHome):not(.hasConstrainedViewport) .matchSurface {")
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one selector {old!r}, found {count}")
              text = text.replace(old, new)
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "mui-1729"
          git config user.email "s1f102503015@iniad.org"
          git add apps/web/app/visual-reference.css
          git commit -m "fix(mobile): constrained viewportのスクロール上書きを防ぐ"
          git push origin HEAD:agent/stabilize-ios-viewport-e2e
