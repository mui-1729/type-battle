name: Patch iOS viewport CSS

on:
  push:
    branches:
      - agent/stabilize-ios-viewport-e2e
    paths:
      - ".github/workflows/patch-ios-viewport-css.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/stabilize-ios-viewport-e2e
      - name: Patch constrained mobile scroll rule
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/app/visual-reference.css")
          text = path.read_text()
          old = '''  .appShell:not(.isHome) .sidePanel,
  .appShell:not(.isHome) .matchSurface {
    height: auto;
    max-height: none;
    overflow: visible;
  }
'''
          new = '''  .appShell:not(.isHome):not(.hasConstrainedViewport) .sidePanel,
  .appShell:not(.isHome):not(.hasConstrainedViewport) .matchSurface {
    height: auto;
    max-height: none;
    overflow: visible;
  }
'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one mobile override block, found {count}")
          path.write_text(text.replace(old, new))
          PY
      - name: Commit patch
        run: |
          git config user.name "mui-1729"
          git config user.email "s1f102503015@iniad.org"
          git add apps/web/app/visual-reference.css
          git commit -m "fix(mobile): constrained viewportのスクロール上書きを防ぐ"
          git push origin HEAD:agent/stabilize-ios-viewport-e2e
