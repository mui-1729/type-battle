name: Agent fix iOS prompt visibility

on:
  push:
    branches: ["agent/fix-ios-keyboard-prompt"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: agent/fix-ios-keyboard-prompt

      - name: Apply guarded page patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("apps/web/app/page.tsx")
          text = path.read_text()

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          replace_once(
          '''import { getPracticeSocketToRelease } from "./_lib/practice-socket-lifecycle";\n''',
          '''import { getPracticeSocketToRelease } from "./_lib/practice-socket-lifecycle";\nimport { getScrollTopToRevealTarget } from "./_lib/scroll-visibility";\n''')

          replace_once(
          '''    const frame = window.requestAnimationFrame(() => {\n      const surface = matchSurfaceRef.current;\n      const prompt = surface?.querySelector<HTMLElement>(".promptBox");\n      if (!surface || !prompt || surface.scrollHeight <= surface.clientHeight) {\n        return;\n      }\n\n      const promptBottom = prompt.offsetTop + prompt.offsetHeight;\n      surface.scrollTo({ top: Math.max(0, promptBottom - surface.clientHeight + 12), behavior: "instant" });\n    });\n''',
          '''    const frame = window.requestAnimationFrame(() => {\n      const surface = matchSurfaceRef.current;\n      const prompt = surface?.querySelector<HTMLElement>(".promptBox");\n      if (!surface || !prompt) {\n        return;\n      }\n\n      const surfaceBounds = surface.getBoundingClientRect();\n      const promptBounds = prompt.getBoundingClientRect();\n      const nextScrollTop = getScrollTopToRevealTarget({\n        scrollTop: surface.scrollTop,\n        containerTop: surfaceBounds.top,\n        containerBottom: surfaceBounds.bottom,\n        targetTop: promptBounds.top,\n        targetBottom: promptBounds.bottom,\n        padding: 12\n      });\n\n      if (Math.abs(nextScrollTop - surface.scrollTop) > 1) {\n        surface.scrollTo({ top: nextScrollTop, behavior: "instant" });\n      }\n    });\n''')

          path.write_text(text)
          PY
          git rm .github/workflows/agent-fix-ios-prompt.yml

      - name: Commit patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/page.tsx
          git commit -m "fix(ios): reveal prompt from rendered viewport bounds"
          git push origin HEAD:agent/fix-ios-keyboard-prompt
